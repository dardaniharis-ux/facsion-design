<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contakt.css">
</head>
<body>

    <div class="forma">
        <h2>Na Kontaktoni</h2>
        <form action="#" method="post">

            <label for="name">Emri</label>
            <input type="text" id="name" placeholder="Shkruaj emrin" required>

            <label for="email">Email</label>
            <input type="email" id="email"  placeholder="Shkruaj Email-in" required>

            <label for="message">Mesazhi</label>
            <textarea id="message" placeholder="Shkruaj mesazhin" required></textarea>

            <button type="submit">Dërgo</button>
        </form>
    </div>

</body>
</html>
